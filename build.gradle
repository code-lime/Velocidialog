import org.gradle.api.attributes.java.TargetJvmVersion
import ru.vyarus.gradle.plugin.animalsniffer.signature.BuildSignatureTask

buildscript {
    configurations.classpath.resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.ow2.asm') {
            details.useVersion '9.8'
            details.because 'Shadow plugin needs ASM ≥9.8 to parse Java 25 classes'
        }
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id "fr.brouillard.oss.gradle.jgitver" version "+"
    id "com.github.johnrengelman.shadow" version "+"
    id "ru.vyarus.animalsniffer" version "2.0.1"
}

//<editor-fold desc="Settings: Plugin">
repositories {
    mavenCentral()
    maven {
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}
dependencies {
    compileOnly "com.velocitypowered:velocity-api:${versionVelocity}"
    annotationProcessor "com.velocitypowered:velocity-api:${versionVelocity}"
}

apply from: 'https://raw.githubusercontent.com/code-lime/org.lime.core/refs/tags/3.1.1/global.gradle'
apply from: 'https://raw.githubusercontent.com/code-lime/org.lime.core/refs/tags/3.1.1/version.gradle'
apply from: 'https://raw.githubusercontent.com/code-lime/org.lime.core/refs/tags/3.1.1/remote.gradle'

//<editor-fold desc="Settings: Plugin: MultiVersion Validator">

// Velocity 4 requires Java 25 to compile against, but the plugin bytecode stays at Java 21.
def compilerJavaVersion = providers.gradleProperty('javaCompilerVersion').get().toInteger()
java {
    toolchain.languageVersion = JavaLanguageVersion.of(compilerJavaVersion)
    withJavadocJar()
}

// These classpaths are used only by javac. Gradle must not reject the Java 25
// Velocity API before the Java 25 compiler can read it.
[configurations.compileClasspath, configurations.annotationProcessor].each { configuration ->
    configuration.attributes {
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, compilerJavaVersion)
    }
}

// Complete minimum-runtime classpath used to build the Velocity 3.4 API
// signature. Production sources are compiled only once against Velocity 4.
configurations {
    velocity34Api
}
dependencies {
    velocity34Api "com.velocitypowered:velocity-api:${versionVelocity34}"
    velocity34Api "net.kyori:adventure-nbt:${versionAdventure}"
    velocity34Api "io.netty:netty-buffer:${versionNetty}"
    velocity34Api "io.netty:netty-common:${versionNetty}"
    velocity34Api "io.netty:netty-transport:${versionNetty}"
    velocity34Api "net.bytebuddy:byte-buddy:${versionByteBuddy}"
    velocity34Api "net.bytebuddy:byte-buddy-agent:${versionByteBuddy}"
    velocity34Api 'org.jetbrains:annotations:26.0.2'
    velocity34Api 'org.jspecify:jspecify:1.0.0'
    velocity34Api 'org.checkerframework:checker-qual:3.49.2'
}

// Inspect production bytecode against Velocity 3.4. This detects JVM
// descriptor changes that source compilation against Velocity 4 cannot see.
def velocity34ApiSignature = tasks.register('velocity34ApiSignature', BuildSignatureTask) {
    description = "Builds an API signature for the Velocity ${versionVelocity34} runtime"
    files configurations.velocity34Api
    outputName = 'velocity34-api'
}

animalsniffer {
    toolVersion = '1.27'
    defaultTargets 'main'
    signatures = velocity34ApiSignature.map { it.outputFiles }.get()

    // Otherwise jars from the newer main compile classpath would make every
    // new API reference appear valid and mask incompatibilities.
    excludeJars '*'

    // Java 9+ runtime signatures are not published by Animal Sniffer. JDK API
    // compatibility is enforced by --release from global.gradle.
    ignore = [
            'java.*',
            'javax.*',
            'jdk.*',
            'sun.*',
            'com.sun.*',
            'org.ietf.*',
            'org.w3c.*',
            'org.xml.*',
    ]
}

tasks.register('validateVelocity34BinaryCompatibility') {
    group = 'verification'
    description = "Checks production bytecode against the Velocity ${versionVelocity34} runtime"
    dependsOn tasks.named('animalsnifferMain')
}
tasks.named('check') {
    dependsOn tasks.named('validateVelocity34BinaryCompatibility')
}
//</editor-fold>

println "Project version: $version"

configureProcessResources(
        tasks.named('processResources', ProcessResources).get(),
        'velocity-plugin.json',
        [:])
tasks.withType(org.gradle.jvm.tasks.Jar).configureEach {
    archiveBaseName.set(project.name)
}
//</editor-fold>

configurations {
    relocate
}

//<editor-fold desc="Settings: Libraries">
//<editor-fold desc="Settings: Libraries: Annotations">
dependencies {
    // These annotations are part of the Paper-shaped public dialog API. Keep
    // them as API metadata without packaging duplicate annotation classes.
    compileOnlyApi 'org.jetbrains:annotations:26.0.2'
    compileOnlyApi 'org.jspecify:jspecify:1.0.0'
    compileOnlyApi 'org.checkerframework:checker-qual:3.49.2'
}
//</editor-fold>
//<editor-fold desc="Settings: Libraries: Adventure NBT">
dependencies {
    // CompoundBinaryTag is public API. Some Velocity distributions do not
    // provide adventure-nbt, so the same module is embedded without relocation.
    api "net.kyori:adventure-nbt:${versionAdventure}"
    relocate "net.kyori:adventure-nbt:${versionAdventure}"
}
//</editor-fold>
//<editor-fold desc="Settings: Libraries: Netty">
dependencies {
    compileOnly "io.netty:netty-buffer:${versionNetty}"
    compileOnly "io.netty:netty-common:${versionNetty}"
    compileOnly "io.netty:netty-transport:${versionNetty}"
}
//</editor-fold>
//<editor-fold desc="Settings: Libraries: Byte Buddy">
dependencies {
    compileOnly "net.bytebuddy:byte-buddy:${versionByteBuddy}"
    compileOnly "net.bytebuddy:byte-buddy-agent:${versionByteBuddy}"
    relocate "net.bytebuddy:byte-buddy:${versionByteBuddy}"
    relocate "net.bytebuddy:byte-buddy-agent:${versionByteBuddy}"
}
shadowJar {
    // ByteBuddyAgent self-attachment resolves these exact names. AgentBuilder
    // comes from byte-buddy core and remains safely relocated.
    relocate('net.bytebuddy', 'org.lime.velocidialog.internal.bytebuddy') {
        exclude 'net/bytebuddy/agent/Attacher*'
        exclude 'net/bytebuddy/agent/ByteBuddyAgent*'
        exclude 'net/bytebuddy/agent/Installer*'
        exclude 'net/bytebuddy/agent/VirtualMachine*'
        exclude 'net/bytebuddy/agent/package-info*'
        exclude 'net/bytebuddy/agent/utility/**'
    }
}
//</editor-fold>
//</editor-fold>

//<editor-fold desc="Settings: Tests">
dependencies {
    // The default suite executes against the minimum supported runtime.
    testImplementation "com.velocitypowered:velocity-api:${versionVelocity34}"
    testImplementation "io.netty:netty-buffer:${versionNetty}"
    testImplementation "io.netty:netty-common:${versionNetty}"
    testImplementation "io.netty:netty-transport:${versionNetty}"
    testImplementation "net.bytebuddy:byte-buddy:${versionByteBuddy}"
    testImplementation "net.bytebuddy:byte-buddy-agent:${versionByteBuddy}"
    testImplementation platform("org.junit:junit-bom:${versionJUnit}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    velocity4Test {
        java.srcDir 'src/velocity4Test/java'
    }
}

[configurations.velocity4TestCompileClasspath, configurations.velocity4TestRuntimeClasspath].each { configuration ->
    configuration.attributes {
        attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, compilerJavaVersion)
    }
}

dependencies {
    velocity4TestImplementation files(sourceSets.main.output)
    velocity4TestImplementation "com.velocitypowered:velocity-api:${versionVelocity}"
    velocity4TestImplementation "net.kyori:adventure-nbt:${versionAdventure}"
    velocity4TestImplementation "io.netty:netty-buffer:${versionNetty}"
    velocity4TestImplementation "io.netty:netty-common:${versionNetty}"
    velocity4TestImplementation "io.netty:netty-transport:${versionNetty}"
    velocity4TestImplementation "net.bytebuddy:byte-buddy:${versionByteBuddy}"
    velocity4TestImplementation "net.bytebuddy:byte-buddy-agent:${versionByteBuddy}"
    velocity4TestImplementation platform("org.junit:junit-bom:${versionJUnit}")
    velocity4TestImplementation 'org.junit.jupiter:junit-jupiter'
    velocity4TestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters', '-Xlint:all,-processing']
}

tasks.named('compileVelocity4TestJava', JavaCompile) {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(compilerJavaVersion)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('test', Test) {
    dependsOn tasks.named('shadowJar')
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    doFirst {
        systemProperty 'velocidialog.test.java', javaLauncher.get().executablePath.asFile.absolutePath
        systemProperty 'velocidialog.test.shadowJar', tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath
    }
}

tasks.register('packagedInstrumentationJava25Test', Test) {
    description = 'Verifies packaged Byte Buddy runtime attachment on Java 25.'
    group = 'verification'
    dependsOn tasks.named('shadowJar'), tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(compilerJavaVersion)
    }
    filter {
        includeTestsMatching 'org.lime.velocidialog.inject.PackagedInstrumentationForkTest'
    }
    doFirst {
        systemProperty 'velocidialog.test.java', javaLauncher.get().executablePath.asFile.absolutePath
        systemProperty 'velocidialog.test.shadowJar', tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath
    }
}

tasks.register('velocity4Test', Test) {
    description = 'Runs the binary compatibility suite on Velocity 4 / Adventure 5 / Java 25.'
    group = 'verification'
    testClassesDirs = sourceSets.velocity4Test.output.classesDirs
    classpath = sourceSets.velocity4Test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(compilerJavaVersion)
    }
    useJUnitPlatform()
}

tasks.named('check') {
    dependsOn tasks.named('velocity4Test'), tasks.named('packagedInstrumentationJava25Test')
}
//</editor-fold>

tasks.named('jar', Jar) {
    archiveClassifier = 'plain'
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.relocate]
}
artifacts {
    archives tasks.shadowJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = 'velocidialog'
            version = project.version
            artifact tasks.shadowJar
            artifact tasks.sourcesJar
            artifact tasks.javadocJar
            pom {
                name = 'Velocidialog'
                description = 'Kyori dialog support for Velocity, including the configuration phase.'
                licenses {
                    license {
                        name = 'GNU General Public License v3.0'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.html'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            def repository = providers.environmentVariable('GITHUB_REPOSITORY')
                    .getOrElse('code-lime/velocidialog')
            url = uri("https://maven.pkg.github.com/${repository}")
            credentials {
                username = providers.environmentVariable('GITHUB_ACTOR')
                        .orElse(providers.environmentVariable('GITHUB_PACKAGE_USERNAME'))
                        .getOrNull()
                password = providers.environmentVariable('GITHUB_TOKEN')
                        .orElse(providers.environmentVariable('GITHUB_PACKAGE_TOKEN'))
                        .getOrNull()
            }
        }
    }
}
